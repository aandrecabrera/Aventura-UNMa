    <script>
        // Web Audio API Sound Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let soundEnabled = true;

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.08);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                }
            } catch (e) {}
        }

            soundEnabled = !soundEnabled;

        }

        // Render Function
        function renderScene(sceneKey) {
            currentScene = sceneKey;
            
            if (sceneKey === 'end') {
                renderEndScreen();
                return;
            }

            const data = gameData[sceneKey];
            if (!data) return;

            // Header Elements
            const badge = document.getElementById('stepBadge');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');

            if (data.badge) {
                badge.innerText = data.badge;
                badge.classList.remove('hidden');
                progressContainer.classList.remove('hidden');
                progressBar.style.width = (data.progress || 0) + '%';
            } else {
                badge.classList.add('hidden');
                progressContainer.classList.add('hidden');
            }

            // Scene Graphics and Texts
            document.getElementById('sceneGraphic').innerHTML = getSVG(data.graphic);
            document.getElementById('sceneTitle').innerText = data.title;
            document.getElementById('sceneBody').innerHTML = data.body;

            // Actions / Options Rendering
            const actionArea = document.getElementById('actionArea');
            actionArea.innerHTML = '';

            data.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-option w-full text-left p-4 rounded-lg font-semibold border flex items-center justify-between gap-3 text-sm sm:text-base ';
                
                if (opt.type === 'start' || opt.type === 'next') {
                    btn.className += 'bg-unma-medium hover:bg-unma-primary text-white border-unma-medium';
                } else if (opt.type === 'retry') {
                    btn.className += 'bg-amber-50 hover:bg-amber-100 text-amber-900 border-amber-300';
                } else {
                    btn.className += 'bg-white hover:bg-slate-50 text-slate-800 border-slate-300 shadow-sm';
                }

                btn.innerHTML = `<span>${opt.text}</span> <span class="text-xs opacity-70">➔</span>`;
                btn.onclick = () => handleChoice(data, opt);
                actionArea.appendChild(btn);
            });

            // Auto-scroll to top smoothly
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Notify parent Moodle iframe if embedded
            notifyHeightChange();
        }

        // Choice Handler Logic
        function handleChoice(currentSceneData, option) {
            // Check first try correctness tracking
            if (currentSceneData.themeId) {
                const tid = currentSceneData.themeId;
                if (firstTryAttempts[tid] === undefined) {
                    firstTryAttempts[tid] = option.isCorrect === true;
                }
            }

            if (option.isCorrect === true) {
                playSound('success');
            } else if (option.isCorrect === false) {
                playSound('error');
            } else {
                playSound('click');
            }

            renderScene(option.target);
        }

        // End Screen Rendering
        function renderEndScreen() {
            playSound('success');

            // Calculate First Try Score
            let correctFirstTryCount = 0;
            for (let i = 1; i <= totalThemesCount; i++) {
                if (firstTryAttempts[i] === true) {
                    correctFirstTryCount++;
                }
            }

            document.getElementById('stepBadge').classList.add('hidden');
            document.getElementById('progressContainer').classList.remove('hidden');
            document.getElementById('progressBar').style.width = '100%';

            document.getElementById('sceneGraphic').innerHTML = getSVG('trophy');
            document.getElementById('sceneTitle').innerText = "Viernes, fin de la primera semana";

            let feedbackText = "";
            let feedbackColor = "";

            if (correctFirstTryCount >= 6) {
                feedbackText = "«Llegás a la segunda semana con el mapa en la mano.»";
                feedbackColor = "bg-emerald-50 text-emerald-900 border-emerald-300";
            } else if (correctFirstTryCount >= 3) {
                feedbackText = "«Hubo algún tropiezo, pero sabés cómo volver al camino. Eso es lo que importa.»";
                feedbackColor = "bg-amber-50 text-amber-900 border-amber-300";
            } else {
                feedbackText = "«Recién empezás, y está perfecto. Los tutoriales están para eso: volvé a la aventura cuando quieras.»";
                feedbackColor = "bg-blue-50 text-blue-900 border-blue-300";
            }

            document.getElementById('sceneBody').innerHTML = `
                <p>Pasaron cinco días. Entraste al campus, te presentaste, entregaste tu primer documento y leíste tu primera devolución.</p>
                <p>Todavía falta mucho. Pero ahora sabés cómo moverte, a quién escribirle y dónde mirar cuando algo no sale.</p>
                
                <div class="mt-6 p-5 rounded-lg border ${feedbackColor}">
                    <div class="text-xs font-bold uppercase tracking-wider mb-1">Tu resultado general</div>
                    <div class="text-xl font-bold mb-2">Resolviste ${correctFirstTryCount} de 7 temas a la primera</div>
                    <p class="text-sm font-semibold italic">${feedbackText}</p>
                </div>
            `;

            const actionArea = document.getElementById('actionArea');
            actionArea.innerHTML = '';

            const restartBtn = document.createElement('button');
            restartBtn.className = 'btn-option w-full text-center p-4 rounded-lg font-bold bg-unma-medium hover:bg-unma-primary text-white border-unma-medium';
            restartBtn.innerHTML = '🔄 Reiniciar Aventura';
            restartBtn.onclick = () => {
                firstTryAttempts = {};
                playSound('click');
                renderScene('intro');
            };

            actionArea.appendChild(restartBtn);
            notifyHeightChange();
        }

        // Notify Moodle iframe for dynamic resizing
        function notifyHeightChange() {
            setTimeout(() => {
                const height = document.body.scrollHeight;
                window.parent.postMessage({ frameHeight: height }, '*');
            }, 100);
        }

        // Initialize App
        window.onload = () => {
            renderScene('intro');
        };
    </script>
